variables:
  NPM_PREFIX: BondageClub/

check:
  stage: build
  only:
    - merge_requests
  image: node:24
  cache:
    key:
      files:
        - BondageClub/package-lock.json
    paths:
      - BondageClub/node_modules/
      - BondageClub/.cache/
  script:
    - npm --prefix $NPM_PREFIX ci --no-fund --no-audit --loglevel=error
    - npm --prefix $NPM_PREFIX run checks:expensive
